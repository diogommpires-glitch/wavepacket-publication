name: Code and numerical checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation -e '.[dev]'
      - run: >-
          python -m pytest tests/test_config.py tests/test_numerics.py
          tests/test_units.py tests/test_validation.py tests/test_studies.py
          tests/test_experiments.py tests/test_audit_science.py -q
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src/wavepacket
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check:api
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: python scripts/build_frontend.py
