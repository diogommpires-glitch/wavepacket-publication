[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "wavepacket-lab"
version = "2.0.0"
description = "Reproducible 1D and 2D quantum dynamics, numerical validation and an interactive local laboratory"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSING.md", "frontend/public/fonts/*-OFL.txt"]
authors = [{name = "diogommpires-glitch"}]
dependencies = [
  "numpy>=2.3,<3", "scipy>=1.16,<2", "pydantic>=2.12,<3",
  "typer>=0.20,<1", "fastapi>=0.120,<1", "uvicorn>=0.38,<1",
  "h5py>=3.14,<4", "matplotlib>=3.10,<4", "psutil>=7,<8",
  "filelock>=4.2.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<3", "build>=1.3,<2"]
notebooks = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7.16,<8", "ipykernel>=7,<8"]

[project.scripts]
wavepacket = "wavepacket.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wavepacket"]
artifacts = ["src/wavepacket/web/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/wavepacket/web/**"]
include = [
  "src/wavepacket", "frontend/src", "frontend/tests", "frontend/scripts", "frontend/public",
  "frontend/package.json", "frontend/package-lock.json", "frontend/index.html",
  "frontend/tsconfig*.json", "frontend/vite.config.ts", "frontend/vitest.config.ts",
  "frontend/biome.json", "frontend/openapi.json", "/notebooks",
  "/tests", "/scripts", "/examples",
  "/README.md", "/LICENSE", "/LICENSING.md", "/pyproject.toml", "/requirements-lock.txt",
  "/Start-Wavepacket.cmd", "/Setup-Linux.cmd", ".github/workflows/ci.yml", "/.gitignore", "/.gitattributes",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.ipynb_checkpoints/**", "frontend/tests/artifacts/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["research: scientific refinement and reference studies", "browser: real browser workflows"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = ["SIM", "FURB", "PERF", "C4", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
